name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "勾选=真的创建 GitHub Release 并上传安装包；不勾=只构建并归档安装包用于验证"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ---------- Windows：NativeAOT 目录版整包（应用内更新器下载的就是这个 zip） ----------
  windows:
    name: Windows x64 包
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # P2-4：更新分发包为「NativeAOT 目录版整包 zip」。
      # NativeAOT 产物不是单文件：libSkiaSharp / av_libglesv2 / e_sqlite3 / libHarfBuzzSharp /
      # libsodium 必须与 exe 同目录；应用内更新器下载 zip → 校验 SHA-256 → 解包 → 原子替换 → 重启。
      - name: Publish main (NativeAOT directory form)
        run: dotnet publish TraeTools.csproj -c Release -r win-x64 --self-contained true -p:EnableAot=true -o publish_aot

      # 兼容引导包：历史客户端内的旧更新器只会下载名为 `TraeTools.exe` 的资产并替换自身。
      - name: Publish main (single-file bootstrap, legacy updater compatible)
        run: dotnet publish TraeTools.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      # P2-1：登录宿主（WinForms + WebView2）是独立进程，不参与主程序的 NativeAOT，单独发布
      - name: Publish login host (separate process, not AOT)
        run: dotnet publish TraeTools.LoginHost/TraeTools.LoginHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_aot

      - name: Zip distribution
        # 必须用 pwsh：Windows PowerShell 5.1 的 Compress-Archive 会把 zip 内路径分隔符写成反斜杠
        shell: pwsh
        run: |
          Get-ChildItem -Path publish_aot -Recurse -Include *.pdb | Remove-Item -Force
          Compress-Archive -Path publish_aot\* -DestinationPath TraeTools-win-x64.zip -Force
          Get-ChildItem -Path publish, publish_aot, TraeTools-win-x64.zip | Select-Object Name, Length

      # 安装包（MSI）：用户不喜欢「解压即用」的便携包，所以除 zip 外再出一个正规安装包。
      # 安装到 Program Files\TraeTools，带开始菜单/桌面快捷方式与卸载项，升级时按 UpgradeCode 覆盖安装。
      # zip 仍然保留：应用内更新器下载的就是它（解包 + 原子替换），两者不能互相替代。
      - name: Build MSI installer (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          wix build installer/TraeTools.wxs -arch x64 -d PublishDir=publish_aot -d ProductVersion=$ver -o TraeTools-win-x64.msi
          Get-Item TraeTools-win-x64.msi | Select-Object Name, Length

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: win-packages
          path: |
            TraeTools-win-x64.msi
            TraeTools-win-x64.zip
            publish\TraeTools.exe
            publish_aot\TraeTools.LoginHost.exe
          if-no-files-found: error

  # ---------- macOS：TraeBar（Swift/AppKit 菜单栏版，源码在 macos 分支）双架构 dmg ----------
  macos:
    name: macOS 包（Intel + Apple Silicon）
    runs-on: macos-latest
    steps:
      - name: Checkout (tag ref)
        uses: actions/checkout@v4

      - name: Checkout TraeBar (macos branch)
        uses: actions/checkout@v4
        with:
          ref: macos
          path: macos-src

      - name: Build and package dmg (Apple Silicon, arm64)
        run: |
          cd macos-src/macos
          swift build -c release --arch arm64
          bash "$GITHUB_WORKSPACE/.github/pkg_dmg.sh" arm64 "${GITHUB_REF_NAME}"
          ls -la TraeBar-macos-arm64.dmg

      - name: Build and package dmg (Intel, x86_64)
        run: |
          cd macos-src/macos
          swift build -c release --arch x86_64
          bash "$GITHUB_WORKSPACE/.github/pkg_dmg.sh" x86_64 "${GITHUB_REF_NAME}"
          ls -la TraeBar-macos-x64.dmg

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: mac-packages
          path: |
            macos-src/macos/TraeBar-macos-arm64.dmg
            macos-src/macos/TraeBar-macos-x64.dmg
          if-no-files-found: error

  # ---------- macOS 完整版：.NET/Avalonia 窗口应用，双架构 dmg ----------
  # 与上面的 macos job（Swift 菜单栏版 TraeBar）是两条独立产品线，同时发布。
  macos-desktop:
    name: macOS 完整版包（Intel + Apple Silicon）
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
            label: arm64
          - arch: x86_64
            rid: osx-x64
            label: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 与 Windows 侧不同：macOS 不开单文件/裁剪/AOT。Avalonia 的 av_libglesv2、
      # libSkiaSharp 等原生库必须与主程序同目录，裁剪还会吃掉 XAML 编译绑定的类型。
      - name: Publish
        run: >
          dotnet publish TraeTools.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:EnableAot=false
          -o out-macos

      - name: Build login host (Swift + WKWebView)
        run: bash .github/build_login_host.sh ${{ matrix.arch }} out-macos

      - name: Package .app + dmg
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('version.json'))['version'])")"
          bash .github/pkg_dotnet_dmg.sh ${{ matrix.arch }} "$VERSION" out-macos

      # 发版只跑确定性契约检查（宿主协议 / 加密往返 / 自启 plist）。
      # GUI 冒烟留给分支探路构建：它依赖窗口服务器时序、Rosetta 冷启动耗时，
      # 用它卡发版会把可恢复的偶发抖动变成发不出去。
      - name: Verify artifacts
        run: bash .github/verify_macos_artifacts.sh ./TraeTools.app/Contents/MacOS

      - name: Upload macOS desktop package
        uses: actions/upload-artifact@v4
        with:
          name: mac-desktop-${{ matrix.label }}
          path: TraeTools-macos-${{ matrix.label }}.dmg
          if-no-files-found: error

  # ---------- 汇总：两个平台都成功后创建 Release ----------
  # 手动触发且 publish=false 时跳过这一步：可以在不发布的前提下验证三平台打包是否真的能出包。
  release:
    name: 创建 Release
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
    needs: [windows, macos, macos-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List packages
        run: ls -la dist/

      # 自动生成更新摘要：取「版本号不大于当前版本」的最近一个 v* tag，
      # 汇总其到本版本之间的全部提交（跳过 merge 提交）。
      - name: Generate release notes
        run: |
          set -e
          CUR="${GITHUB_REF_NAME#v}"
          PREV=""
          for t in $(git tag --list 'v*' --sort=-version:refname); do
            v="${t#v}"
            [ "$v" = "$CUR" ] && continue
            # 四段式版本比较（v1.0.2.2 / v1.0.3）
            gt=0
            IFS=. read -ra A <<< "$v"; IFS=. read -ra B <<< "$CUR"
            for i in 0 1 2 3; do
              x=${A[$i]:-0}; y=${B[$i]:-0}
              if (( x > y )); then gt=1; break; fi
              if (( x < y )); then break; fi
            done
            [ "$gt" = "1" ] && continue   # 大于当前版本（历史遗留超前 tag）跳过
            PREV="$t"; break
          done
          {
            echo "TraeTools ${GITHUB_REF_NAME}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|---|---|---|"
            echo "| Windows x64 | \`TraeTools-win-x64.msi\` | **推荐**。安装到 Program Files，含开始菜单/桌面快捷方式与卸载项，可覆盖升级 |"
            echo "| Windows x64 | \`TraeTools-win-x64.zip\` | 免安装整包（解压即用）。应用内更新用它，一般无需手动下载 |"
            echo "| macOS Apple Silicon | \`TraeTools-macos-arm64.dmg\` | M1 / M2 / M3 / M4 |"
            echo "| macOS Intel | \`TraeTools-macos-x64.dmg\` | x86_64 机型 |"
            echo "| macOS 菜单栏版 | \`TraeBar-macos-arm64.dmg\` / \`-x64.dmg\` | 轻量版，无主窗口，仅菜单栏自动签到 |"
            echo ""
            echo "### 安装说明"
            echo ""
            echo "- **Windows**：双击 MSI 安装（需要管理员权限）。已装旧版会直接覆盖升级，设置与账号数据保留在 \`%APPDATA%\\TraeTools\`，不随卸载删除。"
            echo "- **macOS 完整版**：打开 dmg，把 TraeTools 拖进 Applications。未做 Apple 公证，首次启动需在终端执行 \`xattr -cr /Applications/TraeTools.app\`，或在「系统设置 → 隐私与安全性」点「仍要打开」。"
            echo "- **macOS 菜单栏版**：同上放行步骤，程序位于菜单栏，无 Dock 窗口。"
            echo ""
            echo "### 更新方式"
            echo ""
            echo "设置 → 检查更新，自动下载对应架构的包：Windows 用 zip 整套替换后重启；macOS 用 dmg 替换整个 .app（失败自动回滚）。MSI 用户也可直接下载新 MSI 覆盖安装。"
            echo ""
            if [ -n "${PREV}" ]; then
              echo "### 变更（${PREV#v} → ${CUR}）"
              echo ""
              git log --format='- %s' --no-merges "${PREV}..HEAD" || true
            else
              echo "（首个版本）"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Flatten dist directory
        run: |
          mv dist/publish/* dist/ 2>/dev/null || true
          rmdir dist/publish 2>/dev/null || true
          # 登录宿主发布在 publish_aot/ 下（它不参与主程序 AOT），只把这一个文件提上来，
          # 其余 AOT 产物已经在 TraeTools-win-x64.zip 里了。
          mv dist/publish_aot/TraeTools.LoginHost.exe dist/ 2>/dev/null || true
          rmdir dist/publish_aot 2>/dev/null || true
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeTools ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            dist/TraeTools-win-x64.msi
            dist/TraeTools-win-x64.zip
            dist/TraeTools.exe
            dist/TraeTools.LoginHost.exe
            dist/TraeTools-macos-arm64.dmg
            dist/TraeTools-macos-x64.dmg
            dist/TraeBar-macos-arm64.dmg
            dist/TraeBar-macos-x64.dmg
          generate_release_notes: false

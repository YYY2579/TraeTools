name: CI

# 提交即出包：每次 push / PR 构建三平台包（Windows x64 + macOS Intel + macOS Apple Silicon）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 包
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 与 Release 同形态：NativeAOT 目录版整包（libSkiaSharp 等原生库必须与 exe 同目录）
      - name: Publish main (NativeAOT directory form)
        run: dotnet publish TraeTools.csproj -c Release -r win-x64 --self-contained true -p:EnableAot=true -o publish_aot

      # 登录宿主（WinForms + WebView2）独立进程，不参与 AOT，单独发布
      - name: Publish login host
        run: dotnet publish TraeTools.LoginHost/TraeTools.LoginHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_aot

      - name: Zip distribution
        shell: pwsh
        run: |
          Get-ChildItem -Path publish_aot -Recurse -Include *.pdb | Remove-Item -Force
          Compress-Archive -Path publish_aot\* -DestinationPath TraeTools-win-x64.zip -Force
          Get-ChildItem TraeTools-win-x64.zip | Select-Object Name, Length

      # MSI 定义改了要能当场发现：WiX 语法错只会在构建时报，不会在 dotnet build 报
      - name: Build MSI (validates installer/TraeTools.wxs)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          wix build installer/TraeTools.wxs -arch x64 -d PublishDir=publish_aot -d ProductVersion=$ver -o TraeTools-win-x64.msi
          Get-Item TraeTools-win-x64.msi | Select-Object Name, Length

      # 无界面自检：日志链路 / 失败原因归类（跨平台，纯离线）
      - name: Headless self-tests
        run: |
          dotnet bin/Release/net10.0/win-x64/TraeTools.dll --log-selftest
          dotnet bin/Release/net10.0/win-x64/TraeTools.dll --diagnose-selftest

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TraeTools-win-x64
          path: |
            TraeTools-win-x64.msi
            TraeTools-win-x64.zip
          if-no-files-found: error

  # macOS 桌面版（Avalonia，本仓库代码）编译校验。
  # 之前只有 release 才编它，mac 编不过要等发版才发现；这里加一道 PR 级门禁。
  macos-desktop:
    name: macOS 桌面版编译校验
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (${{ matrix.rid }})
        run: dotnet build TraeTools.csproj -c Release -r ${{ matrix.rid }} --self-contained true

      # 只在原生架构上执行自检：runner 是 Apple Silicon，跑 osx-x64 产物需要 Rosetta，
      # 失败原因是「无法执行」而不是代码问题。这个 job 的目的是「能不能编」，x64 编过即可。
      - name: Headless self-tests
        if: matrix.rid == 'osx-arm64'
        run: |
          dotnet bin/Release/net10.0/${{ matrix.rid }}/TraeTools.dll --crypto-selftest
          dotnet bin/Release/net10.0/${{ matrix.rid }}/TraeTools.dll --log-selftest
          dotnet bin/Release/net10.0/${{ matrix.rid }}/TraeTools.dll --diagnose-selftest
          dotnet bin/Release/net10.0/${{ matrix.rid }}/TraeTools.dll --switch-path-selftest

  macos:
    name: macOS 包（Intel + Apple Silicon）
    runs-on: macos-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4

      # TraeBar（Swift/AppKit 菜单栏版）在 macos 分支的 macos/ 目录，单独检出
      - name: Checkout TraeBar (macos branch)
        uses: actions/checkout@v4
        with:
          ref: macos
          path: macos-src

      - name: Build and package dmg (Apple Silicon, arm64)
        run: |
          cd macos-src/macos
          swift build -c release --arch arm64
          bash "$GITHUB_WORKSPACE/.github/pkg_dmg.sh" arm64 "${GITHUB_REF_NAME:-dev}"
          ls -la TraeBar-macos-arm64.dmg

      - name: Build and package dmg (Intel, x86_64)
        run: |
          cd macos-src/macos
          swift build -c release --arch x86_64
          bash "$GITHUB_WORKSPACE/.github/pkg_dmg.sh" x86_64 "${GITHUB_REF_NAME:-dev}"
          ls -la TraeBar-macos-x64.dmg

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: TraeBar-macos
          path: |
            macos-src/macos/TraeBar-macos-arm64.dmg
            macos-src/macos/TraeBar-macos-x64.dmg
          if-no-files-found: error
